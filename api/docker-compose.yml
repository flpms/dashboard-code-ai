name: template

services:
  mongodb:
    # 8.2 or newer: 8.0 refuses to start on Linux kernel 6.19+, which is what
    # current Docker Desktop runs (MongoDB SERVER-121912).
    image: mongo:8.2
    container_name: template-db
    restart: unless-stopped
    env_file: .env
    environment:
      # No `:-default` fallbacks. A compose file that invents a password when the
      # variable is missing is how a production database ends up with
      # "change-me" on it.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?set it in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?set it in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?set it in .env}
    # Bound to localhost: an unauthenticated Mongo reachable from the internet
    # is how databases end up in ransom notes. Remove the 127.0.0.1 prefix only
    # if you know what is in front of it.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    networks: [app-network]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }

  api:
    container_name: template-api
    restart: unless-stopped
    env_file: .env
    # In CI the image is built and pushed once, then pulled here. `build` stays
    # as the local-development path; set API_IMAGE in the server's .env to use
    # the registry copy instead of rebuilding on the box.
    image: ${API_IMAGE:-template-api:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT:-3001}:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    networks: [app-network]
    volumes:
      - ./logs:/home/node/app/logs
    deploy:
      resources:
        limits: { cpus: '1', memory: 512M }

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
