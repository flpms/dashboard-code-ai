name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Called by the release workflows, so a deploy runs exactly the checks a pull
  # request ran — not a second, drifting copy of them.
  workflow_call:

# `github.workflow` is the *caller's* name when this is reused, which keeps a
# release's copy of CI in its own group. Without it, Release API and Release Web
# share a group with the standalone run and cancel each other on the same push.
#
# Only pull requests cancel in flight: superseding a PR run saves minutes,
# cancelling half a release does not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x', '26.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # PUBLIC_* values are compiled into the bundle and are not secrets. The
      # example file is enough to prove the app type-checks and builds.
      - name: Prepare build env
        run: cp .env.example .env

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build/
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
