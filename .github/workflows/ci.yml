name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Called by the release workflows, so a deploy runs exactly the checks a pull
  # request ran — not a second, drifting copy of them.
  workflow_call:

# `github.workflow` is the *caller's* name when this is reused, which keeps a
# release's copy of CI in its own group. Without it, Release API and Release Web
# share a group with the standalone run and cancel each other on the same push.
#
# Only pull requests cancel in flight: superseding a PR run saves minutes,
# cancelling half a release does not.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Every pull request says what changed for the person running the panel
  # (CONTRIBUTING.md#changelog). Dependabot cannot write the entry, and a change
  # nobody can notice opts out with the skip-changelog label.
  changelog:
    name: Changelog
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: CHANGELOG.md is updated
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::Add an entry under [Unreleased] (see CONTRIBUTING.md#changelog), or label the pull request skip-changelog and say why."
          exit 1

  # The oldest Node the README promises. CI otherwise runs the newest patch of
  # each line, which hides a dependency that dropped an older 24.x (jsdom 30
  # needs 24.15+); --engine-strict turns that EBADENGINE warning into a failure.
  engines:
    name: Engines (Node ${{ matrix.node-version }}, ${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.0.0']
        workspace: [api, web]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci --engine-strict --ignore-scripts

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x', '26.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Lint and format
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      # PUBLIC_* values are compiled into the bundle and are not secrets. The
      # example file is enough to prove the app type-checks and builds.
      - name: Prepare build env
        run: cp .env.example .env

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: web/build/
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: cp .env.example .env
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
